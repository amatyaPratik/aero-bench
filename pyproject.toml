[build-system]
requires=["setuptools>=61.0.0"]
build-backend="setuptools.build_meta"

[project]
name="aerobench"
version="0.1.0"
description="benchmark object detectors on VisDrone aerial imagery: annotation QA, mAP and CPU latency"
requires-python=">=3.11"
dependencies=[
    "numpy",
    "opencv-python-headless"
]

[project.optional-dependencies]
dev=[
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]